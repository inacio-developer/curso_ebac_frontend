<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Kanit";
      }
      .error {
        color: white;
      }
    </style>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="./src/js/jquery.mask.min.js"></script>
    <script src="./src/js/jquery.validate.min.js"></script>
    <title>Dunder Mifflin</title>
  </head>
  <body
    style="height: 100vh"
    class="w-100 mx-auto custom-gradient"
    style="--bs-bg-opacity: 0.5"
  >
    <section class="bg-dark">
      <header
        class="container-md d-flex justify-content-between align-items-center py-4"
      >
        <div class="">
          <img style="width: 150px" src="./src/img/dunder-mifflin.png" />
        </div>
        <nav>
          <ul class="d-flex list-unstyled my-0">
            <li class="d-inline-block me-4">
              <a
                class="text-light text-decoration-none fw-semibold text-uppercase"
                href="#about"
                >About</a
              >
            </li>
            <li>
              <a
                class="text-light text-decoration-none fw-semibold text-uppercase"
                href="#donate"
                >Donate</a
              >
            </li>
          </ul>
        </nav>
      </header>
    </section>
    <main>
      <section
        class="container-md mx-auto d-lg-flex justify-content-between align-items-center m-5"
        id="about"
      >
        <div class="">
          <h1 class="text-uppercase fw-bold text-center text-md-start">
            Dunder Mifflin solitary
          </h1>
          <p class="fw-light mt-3">
            Contribute to our charity raffle to help support the students of
            Whitney M. Young Magnet School in their journey to university.
          </p>
          <p class="fw-light">
            If you'd like to help, please fill out the form below.
          </p>
        </div>
        <img class="w-50 m-3 my-lg-0" src="./src/img/about-photo.png" />
      </section>
      <section class="p-5 bg-dark container-md opacity-75" id="donate">
        <h1 class="text-light text-uppercase text-center pb-4">Donate</h1>
        <form class="row container-md mx-auto gap-3">
          <input class="py-2" type="text" placeholder="Full Name" name="name" />
          <input
            class="py-2 text-dark"
            type="email"
            placeholder="E-mail"
            name="email"
          />
          <input class="py-2" type="tel" placeholder="Phone" name="phone" />
          <textarea
            class="form-control"
            placeholder="Send your message"
            name="textarea"
            rows="5"
          ></textarea>
          <button class="btn btn-primary py-3 mt-3">SUBMIT</button>
        </form>
      </section>
    </main>
    <footer class="bg-dark py-3 mt-5">
      <span class="d-block text-center text-light"
        >&#169; Developed by
        <a href="https://github.com/inacio-developer" class="text-light"
          >Rafael Inacio</a
        >
        for studies</span
      >
    </footer>
    <script>
      $(document).ready(() => {
        $("input[type='tel']").mask("(00) 0 0000-0000", {
          placeholder: "(00) 0 0000-0000",
        });

        $("form").validate({
          rules: {
            name: {
              required: true,
            },
            email: {
              required: true,
              email: true,
            },
            phone: {
              required: true,
            },
          },
          messages: {
            name: "Please enter your name",
            email: "Please enter a valid e-mail address",
            phone: "Please enter your phone",
          },
        });
        console.log($("input[type='tel']"));
      });
    </script>
  </body>
</html>
